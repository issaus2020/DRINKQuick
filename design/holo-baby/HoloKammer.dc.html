<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    a { color: #86b6ef; } a:hover { color: #9ec5f4; }

    /* Die Flüssigkeit atmet: zwei Wellen, verschieden schnell, damit die
       Oberfläche nicht wie ein starrer Balken wirkt. */
    @keyframes hk-flow { to { transform: translateX(-160px); } }
    .hk-wave  { animation: hk-flow 11s linear infinite; }
    .hk-wave2 { animation: hk-flow 17s linear infinite reverse; opacity: .55; }

    /* Der Messstrahl wandert einmal alle acht Sekunden durch die Kammer -
       das ist die eine Bewegung, die "gemessen" sagt. */
    @keyframes hk-scan {
      0%   { transform: translateY(150px); opacity: 0; }
      12%  { opacity: .9; }
      88%  { opacity: .9; }
      100% { transform: translateY(-6px); opacity: 0; }
    }
    .hk-scan { animation: hk-scan 8s cubic-bezier(.4,0,.6,1) infinite; }

    /* Staub im Lichtkegel - das, was einen Raum kinematisch macht. */
    @keyframes hk-drift {
      0%   { transform: translateY(0); opacity: 0; }
      20%  { opacity: .8; }
      100% { transform: translateY(-90px); opacity: 0; }
    }
    .hk-mote { animation: hk-drift 9s ease-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .hk-wave, .hk-wave2, .hk-scan, .hk-mote { animation: none; }
    }
  </style>
</helmet>

<div style="position: relative; width: 100%; height: 100%; background: #0a0a0c; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Lichtpool hinter der Figur: die Kammer hat eine Quelle, nicht nur eine Farbe. -->
  <div style="position: absolute; left: 50%; top: 46%; width: 620px; height: 620px; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(45,120,214,.30), rgba(45,120,214,.06) 55%, transparent 72%); pointer-events: none;"></div>

  <div style="position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 8px 0 0;">
    <svg viewBox="0 0 320 400" width="416" height="520" style="display: block; overflow: visible;">
      <defs>
        <filter id="hkGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="hkSoft" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.4"/>
        </filter>
        <filter id="hkFar" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.6"/>
        </filter>

        <!-- Die Milch: unten dicht und dunkel, an der Oberfläche hell. -->
        <linearGradient id="hkMilk" gradientUnits="userSpaceOnUse" x1="160" y1="314" x2="160" y2="168">
          <stop offset="0"   stop-color="#0f2f5c"/>
          <stop offset="0.5" stop-color="#2a78d6"/>
          <stop offset="1"   stop-color="#a8ecff"/>
        </linearGradient>

        <linearGradient id="hkShaft" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bfe6ff" stop-opacity=".16"/>
          <stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="hkFloor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4fa0e8" stop-opacity="0"/>
          <stop offset="1" stop-color="#4fa0e8" stop-opacity=".5"/>
        </linearGradient>

        <clipPath id="hkBelly">
          <path d="M160 168 C 108 168, 82 200, 82 242 C 82 288, 116 314, 160 314 C 204 314, 238 288, 238 242 C 238 200, 212 168, 160 168 Z"/>
        </clipPath>
      </defs>

      <!-- Hintergrund: Gitterboden in Fluchtlinien, leicht unscharf. Tiefe
           entsteht durch Unschärfe, nicht durch mehr Linien. -->
      <g filter="url(#hkFar)" opacity=".55">
        <g stroke="url(#hkFloor)" stroke-width="1" fill="none">
          <path d="M-40 396 L160 336 L360 396"/>
          <path d="M-10 380 L160 330 L330 380"/>
          <path d="M30 366 L160 326 L290 366"/>
          <path d="M70 354 L160 322 L250 354"/>
        </g>
        <g stroke="url(#hkFloor)" stroke-width="1" fill="none">
          <path d="M0 400 L0 400 M-40 396 L360 396" opacity=".8"/>
          <path d="M-10 380 L330 380" opacity=".6"/>
          <path d="M30 366 L290 366" opacity=".45"/>
          <path d="M70 354 L250 354" opacity=".3"/>
        </g>
      </g>

      <!-- Lichtschacht von oben links: die Kammer wird beleuchtet. -->
      <path d="M96 -30 L232 -30 L286 330 L44 330 Z" fill="url(#hkShaft)" filter="url(#hkSoft)"/>

      <!-- Staubteilchen im Schacht -->
      <g fill="#cdeaff">
        <circle class="hk-mote" cx="118" cy="300" r="1.6" opacity=".7" style="animation-delay: 0s"/>
        <circle class="hk-mote" cx="204" cy="316" r="1.2" opacity=".6" style="animation-delay: 2.4s"/>
        <circle class="hk-mote" cx="152" cy="290" r="1" opacity=".5" style="animation-delay: 4.1s"/>
        <circle class="hk-mote" cx="240" cy="308" r="1.4" opacity=".55" style="animation-delay: 6.2s"/>
        <circle class="hk-mote" cx="84" cy="312" r="1.1" opacity=".5" style="animation-delay: 7.5s"/>
      </g>

      <!-- Die Figur. Nur Kontur und Licht - kein Hautton, keine Fläche. -->
      <g>
        <!-- Bauchglas: die leere Kammer, bevor etwas darin ist -->
        <path d="M160 168 C 108 168, 82 200, 82 242 C 82 288, 116 314, 160 314 C 204 314, 238 288, 238 242 C 238 200, 212 168, 160 168 Z"
              fill="rgba(120,190,255,.05)" stroke="rgba(150,205,255,.34)" stroke-width="1.6"/>

        <!-- Füllstand -->
        <g clip-path="url(#hkBelly)">
          <rect x="70" y="{{ fillTop }}" width="180" height="150" fill="url(#hkMilk)" opacity=".92"/>
          <g style="transform: translate(-40px, {{ fillTopPx }})">
            <path class="hk-wave" d="M0 0 Q 20 -6, 40 0 T80 0 T120 0 T160 0 T200 0 T240 0 T280 0 T320 0 T360 0 T400 0 T440 0 T480 0 T520 0 T560 0 T600 0 T640 0" fill="none" stroke="#dff5ff" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>
            <path class="hk-wave2" d="M0 5 Q 20 -1, 40 5 T80 5 T120 5 T160 5 T200 5 T240 5 T280 5 T320 5 T360 5 T400 5 T440 5 T480 5 T520 5 T560 5 T600 5 T640 5" fill="none" stroke="#8fd8ff" stroke-width="2" stroke-linecap="round" opacity=".45"/>
          </g>
          <!-- Meniskus: die helle Kante, die die Menge ablesbar macht -->
          <rect x="70" y="{{ meniscus }}" width="180" height="2" fill="#dff5ff" opacity=".9" filter="url(#hkSoft)"/>
          <!-- Messstrahl -->
          <rect class="hk-scan" x="70" y="168" width="180" height="1.2" fill="#bfe9ff" opacity=".8"/>
        </g>

        <!-- Bauchkontur noch einmal darüber, damit das Glas vor der Flüssigkeit liegt -->
        <path d="M160 168 C 108 168, 82 200, 82 242 C 82 288, 116 314, 160 314 C 204 314, 238 288, 238 242 C 238 200, 212 168, 160 168 Z"
              fill="none" stroke="#9fd6ff" stroke-width="1.8" opacity=".85"/>
        <!-- Kantenlicht links oben -->
        <path d="M118 178 C 96 190, 84 214, 83 238" fill="none" stroke="#eaf8ff" stroke-width="2.2" stroke-linecap="round" opacity=".55" filter="url(#hkSoft)"/>

        <!-- Füße -->
        <ellipse cx="132" cy="322" rx="20" ry="10" fill="rgba(120,190,255,.06)" stroke="#7fc6f5" stroke-width="1.5"/>
        <ellipse cx="188" cy="322" rx="20" ry="10" fill="rgba(120,190,255,.06)" stroke="#7fc6f5" stroke-width="1.5"/>

        <!-- Arme -->
        <path d="M92 206 C 70 214, 62 240, 70 262" fill="none" stroke="#7fc6f5" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M228 206 C 250 214, 258 240, 250 262" fill="none" stroke="#7fc6f5" stroke-width="2.4" stroke-linecap="round"/>

        <!-- Ohren -->
        <circle cx="92" cy="116" r="14" fill="rgba(120,190,255,.05)" stroke="#7fc6f5" stroke-width="1.8"/>
        <circle cx="228" cy="116" r="14" fill="rgba(120,190,255,.05)" stroke="#7fc6f5" stroke-width="1.8"/>

        <!-- Kopf -->
        <circle cx="160" cy="108" r="62" fill="rgba(120,190,255,.05)" stroke="#9fd6ff" stroke-width="2" filter="url(#hkGlow)"/>
        <!-- Kantenlicht am Kopf -->
        <path d="M112 72 C 122 58, 140 48, 158 46" fill="none" stroke="#f2fbff" stroke-width="2.6" stroke-linecap="round" opacity=".6" filter="url(#hkSoft)"/>
        <!-- Haarsträhne -->
        <path d="M148 50 Q160 36 173 49" fill="none" stroke="#7fc6f5" stroke-width="2.2" stroke-linecap="round"/>

        <!-- Gesicht: die Züge tragen die Aussage, deshalb am hellsten. -->
        <g filter="url(#hkGlow)" stroke="#ecf9ff" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="{{ eyes }}" stroke-width="{{ eyeWidth }}"/>
          <path d="{{ mouth }}" stroke-width="3"/>
        </g>

        <!-- Wangen: erscheinen erst mit dem Füllstand -->
      </g>

      <!-- Messskala rechts: fünf Marken, die aktive hell. Ablesbar, ohne zu zählen. -->
      <g stroke="#5e9bd0" stroke-width="1.4" stroke-linecap="round">
        <path d="M252 168 L252 314" stroke-width="1" opacity=".3"/>
        <path d="M252 314 L268 314" opacity=".5"/>
        <path d="M252 278 L264 278" opacity=".35"/>
        <path d="M252 241 L268 241" opacity=".5"/>
        <path d="M252 205 L264 205" opacity=".35"/>
        <path d="M252 168 L268 168" opacity=".5"/>
      </g>
      <path d="M246 {{ meniscus }} L276 {{ meniscus }}" stroke="#dff5ff" stroke-width="2" stroke-linecap="round" filter="url(#hkGlow)"/>
    </svg>
  </div>

  <!-- Die Zahl gehört zur Figur, nicht daneben: derselbe Blick liest beides. -->
  <div style="position: relative; display: flex; align-items: baseline; justify-content: center; gap: 10px; padding: 0 0 34px;">
    <span style="font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; font-size: 46px; line-height: 1; color: #dff1ff; letter-spacing: -0.02em;">{{ ml }}</span>
    <span style="font-size: 15px; font-weight: 650; color: #86b6ef;">von {{ targetMl }} ml heute</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "fill": {"editor": "range", "default": 62, "min": 0, "max": 115, "step": 1, "unit": "%", "section": "Füllstand"},
  "targetMl": {"editor": "int", "default": 605, "min": 100, "max": 1200, "step": 5, "section": "Füllstand"},
  "$preview": {"width": 560, "height": 640}
}'>
class Component extends DCLogic {
  renderVals() {
    // Bauchgeometrie im Koordinatensystem der Zeichnung.
    const TOP = 168;
    const BOTTOM = 314;

    const pct = Math.max(0, Math.min(115, this.props.fill ?? 62));
    const ratio = pct / 100;
    const clamped = Math.min(1, ratio);
    const fillTop = BOTTOM - clamped * (BOTTOM - TOP);

    // Über dem Richtwert steigt die Füllung nicht weiter - sonst wäre nicht
    // erkennbar, dass er schon überschritten ist.
    const over = ratio > 1.02;

    // Der Mund trägt die Hauptaussage und wandert stufenlos mit: von einer
    // ruhigen Linie zu einem breiten Lachen. Er geht nie nach unten - ein
    // leerer Magen am Morgen ist kein Vorwurf.
    const depth = 3 + clamped * 15;
    const half = 13 + clamped * 6;
    const mouth = `M${(160 - half).toFixed(1)} 134 Q160 ${(134 + depth).toFixed(1)} ${(160 + half).toFixed(1)} 134`;

    // Die Augen wechseln in Stufen: offen, lachend, und über dem Ziel
    // zufrieden geschlossen.
    const happy = clamped >= 0.72;
    const eyes = over
      ? 'M126 106 Q136 118 146 106 M174 106 Q184 118 194 106'
      : happy
        ? 'M126 112 Q136 98 146 112 M174 112 Q184 98 194 112'
        : 'M136 108 L136 108 M184 108 L184 108';

    return {
      fillTop,
      fillTopPx: `${fillTop}px`,
      meniscus: fillTop,
      mouth,
      eyes,
      eyeWidth: happy || over ? 3.4 : 9,
      ml: Math.round((this.props.targetMl ?? 605) * ratio),
      targetMl: this.props.targetMl ?? 605,
    };
  }
}
</script>
</body>
</html>
