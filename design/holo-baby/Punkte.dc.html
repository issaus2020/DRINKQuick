<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    a { color: #c0a8f5; } a:hover { color: #d7c8fa; }

    /* Die Wolke atmet. Sehr langsam und sehr wenig - eine Punktwolke, die
       zappelt, wirkt kaputt statt lebendig. */
    @keyframes pt-breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.012); }
    }
    .pt-cloud { animation: pt-breathe 8s ease-in-out infinite; transform-origin: 160px 220px; }

    @media (prefers-reduced-motion: reduce) { .pt-cloud { animation: none; } }
  </style>
</helmet>

<div style="position: relative; width: 100%; height: 100%; background: #07060b; overflow: hidden; display: flex; flex-direction: column;">

  <div style="position: absolute; inset: 0; background: radial-gradient(55% 42% at 50% 42%, rgba(120,90,220,.20), transparent 74%); pointer-events: none;"></div>

  <div style="position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center;">
    <svg viewBox="0 0 320 400" width="396" height="495" style="display: block;">
      <defs>
        <filter id="ptGlow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="ptSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>

      <!-- Der Schein, den die gefüllte Hälfte in den Raum wirft -->
      <ellipse cx="160" cy="{{ glowCy }}" rx="98" ry="{{ glowRy }}" fill="#9ad8ff" opacity="{{ glowOpacity }}" filter="url(#ptSoft)"/>

      <!-- Die Figur besteht aus nichts als Punkten. Wo sie dicht stehen, ist
           Körper; wo sie hell sind, ist Milch. Keine Kontur, keine Fläche. -->
      <g class="pt-cloud">
        <sc-for list="{{ points }}" as="p" hint-placeholder-count="240">
          <circle cx="{{ p.x }}" cy="{{ p.y }}" r="{{ p.r }}" fill="{{ p.paint }}" opacity="{{ p.opacity }}"/>
        </sc-for>
      </g>

      <!-- Die Oberfläche: eine Reihe dichterer, hellerer Punkte statt einer
           Linie - sonst bräche die Bildsprache genau an der wichtigsten
           Stelle. -->
      <g filter="url(#ptGlow)">
        <sc-for list="{{ surface }}" as="s" hint-placeholder-count="18">
          <circle cx="{{ s.x }}" cy="{{ s.y }}" r="{{ s.r }}" fill="#ffffff" opacity="{{ s.opacity }}"/>
        </sc-for>
      </g>

      <!-- Gesicht -->
      <g stroke="#f2ecff" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#ptGlow)">
        <path d="{{ eyes }}" stroke-width="{{ eyeWidth }}"/>
        <path d="{{ mouth }}" stroke-width="3"/>
      </g>
    </svg>
  </div>

  <div style="position: relative; display: flex; align-items: baseline; justify-content: center; gap: 10px; padding: 0 0 14px;">
    <span style="font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; font-size: 46px; line-height: 1; color: #f4efff; letter-spacing: -0.02em;">{{ ml }}</span>
    <span style="font-size: 15px; font-weight: 650; color: #a795d8;">von {{ targetMl }} ml heute</span>
  </div>
  <p style="position: relative; margin: 0; padding: 0 26px 26px; text-align: center; font-size: 12px; line-height: 1.45; color: #7b6ba8;">
    {{ litPoints }} von {{ bellyPoints }} Punkten im Bauch leuchten.
  </p>
</div>
</x-dc>

<script data-dc-script data-props='{
  "fill": {"editor": "range", "default": 62, "min": 0, "max": 115, "step": 1, "unit": "%", "section": "Füllstand"},
  "targetMl": {"editor": "int", "default": 605, "min": 100, "max": 1200, "step": 5, "section": "Füllstand"},
  "$preview": {"width": 560, "height": 660}
}'>
class Component extends DCLogic {
  renderVals() {
    const HEAD = { cy: 104, r: 60 };
    const BELLY = { cy: 244, r: 75 };
    const CX = 160;
    const TOP = BELLY.cy - BELLY.r;
    const BOTTOM = BELLY.cy + BELLY.r;
    const STEP = 8;

    const pct = Math.max(0, Math.min(115, this.props.fill ?? 62));
    const ratio = pct / 100;
    const clamped = Math.min(1, ratio);
    const fillTop = BOTTOM - clamped * (BOTTOM - TOP);
    const over = ratio > 1.02;
    const target = this.props.targetMl ?? 605;

    /**
     * Streuung ohne Zufall: dieselbe Eingabe ergibt immer dieselbe Wolke.
     * Math.random() würde bei jedem Neuzeichnen eine andere Figur liefern -
     * beim Schieben des Reglers sähe das aus wie Rauschen.
     */
    const jitter = (x, y, salt) => {
      const n = Math.sin(x * 12.9898 + y * 78.233 + salt * 37.719) * 43758.5453;
      return n - Math.floor(n);
    };

    const points = [];
    let lit = 0;
    let bellyCount = 0;

    for (let gy = 40; gy <= 340; gy += STEP) {
      for (let gx = 74; gx <= 246; gx += STEP) {
        const jx = (jitter(gx, gy, 1) - 0.5) * STEP * 0.75;
        const jy = (jitter(gx, gy, 2) - 0.5) * STEP * 0.75;
        const x = gx + jx;
        const y = gy + jy;

        const dHead = Math.hypot(x - CX, y - HEAD.cy);
        const dBelly = Math.hypot(x - CX, y - BELLY.cy);
        const inHead = dHead <= HEAD.r;
        const inBelly = dBelly <= BELLY.r;
        // Der Hals, sonst schweben Kopf und Bauch getrennt.
        const inNeck = Math.abs(x - CX) <= 21 && y > 150 && y < 186;
        if (!inHead && !inBelly && !inNeck) continue;

        // Nähe zum Rand: aussen dünner besetzt, das gibt der Wolke Volumen.
        const edge = inBelly ? dBelly / BELLY.r : inHead ? dHead / HEAD.r : 0.5;
        if (edge > 0.94 && jitter(gx, gy, 3) > 0.45) continue;

        if (inBelly) bellyCount++;
        const underWater = inBelly && y >= fillTop;
        if (underWater) lit++;

        // Wie tief unter der Oberfläche - danach richtet sich die Helligkeit.
        const depth = underWater ? Math.min(1, (y - fillTop) / 70) : 0;

        points.push({
          x: x.toFixed(1),
          y: y.toFixed(1),
          r: (underWater ? 1.5 + (1 - depth) * 1.1 : 1.25 + (1 - edge) * 0.6).toFixed(2),
          paint: underWater
            ? (over ? '#8df0b6' : depth < 0.35 ? '#ecf7ff' : '#63a9e8')
            : '#8f83c8',
          opacity: underWater
            ? (0.7 + (1 - depth) * 0.3).toFixed(2)
            : (0.34 + (1 - edge) * 0.4).toFixed(2),
        });
      }
    }

    // Die Oberfläche als eigene Punktreihe auf dem Schnitt durch die Kugel.
    const dy = fillTop - BELLY.cy;
    const cut = Math.sqrt(Math.max(0, BELLY.r * BELLY.r - dy * dy));
    const surface = [];
    if (clamped >= 0.005 && cut > 4) {
      const count = Math.max(6, Math.round((cut * 2) / 8));
      for (let i = 0; i <= count; i++) {
        const t = i / count;
        const x = CX - cut + t * cut * 2;
        surface.push({
          x: x.toFixed(1),
          y: (fillTop + Math.sin(t * Math.PI * 3) * 1.6).toFixed(1),
          r: (1.4 + Math.sin(t * Math.PI) * 1.1).toFixed(2),
          opacity: (0.5 + Math.sin(t * Math.PI) * 0.5).toFixed(2),
        });
      }
    }

    const mouthDepth = 3 + clamped * 15;
    const half = 13 + clamped * 6;
    const happy = clamped >= 0.72;

    return {
      points,
      surface,
      glowCy: (fillTop + (BOTTOM - fillTop) / 2).toFixed(1),
      glowRy: (Math.max(10, (BOTTOM - fillTop) / 2)).toFixed(1),
      glowOpacity: (clamped * 0.3).toFixed(2),
      mouth: `M${(CX - half).toFixed(1)} 130 Q${CX} ${(130 + mouthDepth).toFixed(1)} ${(CX + half).toFixed(1)} 130`,
      eyes: over
        ? 'M126 102 Q136 114 146 102 M174 102 Q184 114 194 102'
        : happy
          ? 'M126 108 Q136 94 146 108 M174 108 Q184 94 194 108'
          : 'M136 104 L136 104 M184 104 L184 104',
      eyeWidth: happy || over ? 3.4 : 9,
      litPoints: lit,
      bellyPoints: bellyCount,
      ml: Math.round(target * ratio),
      targetMl: target,
    };
  }
}
</script>
</body>
</html>
