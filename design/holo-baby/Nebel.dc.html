<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    a { color: #c9bff0; } a:hover { color: #ded7f7; }

    /* Die Aurora der App, nur langsamer und dunkler: das ist die
       Bildsprache, die DRINKQuick ohnehin hinter allem liegen hat. */
    @keyframes nb-drift-a { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(28px,-22px) scale(1.12); } }
    @keyframes nb-drift-b { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-24px,18px) scale(1.08); } }
    .nb-bloom-a { animation: nb-drift-a 26s ease-in-out infinite; }
    .nb-bloom-b { animation: nb-drift-b 34s ease-in-out infinite; }

    /* Das Licht im Bauch pulst mit dem Atem des Kindes - langsam genug, dass
       es beruhigt statt zu blinken. */
    @keyframes nb-breathe { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
    .nb-core { animation: nb-breathe 6s ease-in-out infinite; }

    @keyframes nb-rise {
      0%   { transform: translateY(0) scale(.6); opacity: 0; }
      25%  { opacity: .9; }
      100% { transform: translateY(-120px) scale(1); opacity: 0; }
    }
    .nb-mote { animation: nb-rise 11s ease-out infinite; }

    @keyframes nb-flow { to { transform: translateX(-160px); } }
    .nb-wave { animation: nb-flow 13s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .nb-bloom-a, .nb-bloom-b, .nb-core, .nb-mote, .nb-wave { animation: none; }
    }
  </style>
</helmet>

<div style="position: relative; width: 100%; height: 100%; background: #0d0c10; overflow: hidden; display: flex; flex-direction: column;">

  <div class="nb-bloom-a" style="position: absolute; left: -60px; top: -40px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(closest-side, rgba(142,199,239,.28), transparent 70%); filter: blur(18px); pointer-events: none;"></div>
  <div class="nb-bloom-b" style="position: absolute; right: -80px; top: 180px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(closest-side, rgba(242,201,168,.22), transparent 70%); filter: blur(22px); pointer-events: none;"></div>
  <div class="nb-bloom-a" style="position: absolute; left: 90px; bottom: -120px; width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(closest-side, rgba(201,191,240,.24), transparent 70%); filter: blur(20px); pointer-events: none; animation-delay: -12s;"></div>

  <div style="position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 12px 0 0;">
    <svg viewBox="0 0 320 400" width="416" height="520" style="display: block; overflow: visible;">
      <defs>
        <filter id="nbGlow" x="-70%" y="-70%" width="240%" height="240%">
          <feGaussianBlur stdDeviation="9" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="nbSoft" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
        <filter id="nbEdge" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2"/>
        </filter>

        <!-- Der Kern: warm unten, kühl an der Oberfläche. Dieselben drei
             Aurora-Farben wie in der App, nur konzentriert. -->
        <linearGradient id="nbCore" gradientUnits="userSpaceOnUse" x1="160" y1="314" x2="160" y2="168">
          <stop offset="0"    stop-color="#f2c9a8"/>
          <stop offset="0.45" stop-color="#c9bff0"/>
          <stop offset="1"    stop-color="#8ec7ef"/>
        </linearGradient>

        <radialGradient id="nbHalo" cx="50%" cy="72%" r="60%">
          <stop offset="0"   stop-color="#f2c9a8" stop-opacity=".5"/>
          <stop offset="0.55" stop-color="#c9bff0" stop-opacity=".18"/>
          <stop offset="1"   stop-color="#8ec7ef" stop-opacity="0"/>
        </radialGradient>

        <clipPath id="nbBelly">
          <path d="M160 168 C 108 168, 82 200, 82 242 C 82 288, 116 314, 160 314 C 204 314, 238 288, 238 242 C 238 200, 212 168, 160 168 Z"/>
        </clipPath>
      </defs>

      <!-- Der Schein, den die Figur in den Raum wirft -->
      <ellipse cx="160" cy="252" rx="104" ry="96" fill="url(#nbHalo)" opacity="{{ haloOpacity }}"/>

      <!-- Bodenreflex: das Licht trifft auf etwas. -->
      <ellipse cx="160" cy="336" rx="{{ reflectRx }}" ry="9" fill="#c9bff0" opacity="{{ reflectOpacity }}" filter="url(#nbSoft)"/>

      <!-- Die Figur als Silhouette. Kein Hautton - das Dunkel ist Schatten,
           keine Haut, und was leuchtet, ist ausschließlich die Menge. -->
      <g>
        <ellipse cx="132" cy="322" rx="21" ry="11" fill="#0f0e14"/>
        <ellipse cx="188" cy="322" rx="21" ry="11" fill="#0f0e14"/>

        <path d="M92 206 C 68 214, 60 242, 70 266" fill="none" stroke="#0f0e14" stroke-width="13" stroke-linecap="round"/>
        <path d="M228 206 C 252 214, 260 242, 250 266" fill="none" stroke="#0f0e14" stroke-width="13" stroke-linecap="round"/>

        <circle cx="92" cy="116" r="15" fill="#0f0e14"/>
        <circle cx="228" cy="116" r="15" fill="#0f0e14"/>

        <path d="M160 168 C 108 168, 82 200, 82 242 C 82 288, 116 314, 160 314 C 204 314, 238 288, 238 242 C 238 200, 212 168, 160 168 Z" fill="#0f0e14"/>
        <circle cx="160" cy="108" r="62" fill="#0f0e14"/>
        <path d="M148 50 Q160 34 174 48" fill="none" stroke="#0f0e14" stroke-width="7" stroke-linecap="round"/>
      </g>

      <!-- Der Kern im Bauch: die Menge ist die Menge an Licht. -->
      <g clip-path="url(#nbBelly)" class="nb-core">
        <rect x="70" y="{{ fillTop }}" width="180" height="150" fill="url(#nbCore)" opacity=".88"/>
        <!-- Die Oberfläche ist keine Linie, sondern ein Übergang: darüber
             löst sich das Licht in Nebel auf. -->
        <rect x="70" y="{{ fillTop }}" width="180" height="3" fill="#fdf6ef" opacity=".5" filter="url(#nbEdge)"/>
        <g style="transform: translate(-40px, {{ fillTopPx }})">
          <path class="nb-wave" d="M0 0 Q 20 -5, 40 0 T80 0 T120 0 T160 0 T200 0 T240 0 T280 0 T320 0 T360 0 T400 0 T440 0 T480 0 T520 0 T560 0 T600 0 T640 0" fill="none" stroke="#fff6ec" stroke-width="2.8" stroke-linecap="round" opacity=".8"/>
        </g>
      </g>

      <!-- Teilchen, die aus dem Kern aufsteigen -->
      <g fill="#f4e8dc" clip-path="url(#nbBelly)">
        <circle class="nb-mote" cx="128" cy="300" r="2" style="animation-delay: 0s"/>
        <circle class="nb-mote" cx="176" cy="308" r="1.5" style="animation-delay: 2.8s"/>
        <circle class="nb-mote" cx="150" cy="296" r="1.2" style="animation-delay: 5.4s"/>
        <circle class="nb-mote" cx="204" cy="304" r="1.8" style="animation-delay: 8.1s"/>
      </g>

      <!-- Kantenlicht: der Umriss wird von hinten angeschnitten. Das ist der
           Griff, mit dem ein Bild kinematisch wird. -->
      <g fill="none" stroke-linecap="round" opacity=".9">
        <path d="M102 82 C 114 60, 136 47, 160 45" stroke="#f4f8ff" stroke-width="3.6" filter="url(#nbEdge)"/>
        <path d="M112 178 C 90 192, 81 216, 82 244" stroke="#dcd4fb" stroke-width="3.2" filter="url(#nbEdge)"/>
        <path d="M209 180 C 231 194, 239 218, 238 244" stroke="#f7d8bb" stroke-width="2.6" opacity=".8" filter="url(#nbEdge)"/>
        <path d="M78 122 C 82 108, 88 100, 96 104" stroke="#dcd4fb" stroke-width="2.4" opacity=".7" filter="url(#nbEdge)"/>
      </g>

      <!-- Gesicht: aus dem Dunkel herausgeschnitten, im Ton des Kerns. -->
      <g filter="url(#nbGlow)" stroke="#fdf6ef" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="{{ eyes }}" stroke-width="{{ eyeWidth }}"/>
        <path d="{{ mouth }}" stroke-width="3.2"/>
      </g>

      <ellipse cx="120" cy="132" rx="13" ry="6.5" fill="#ffd9b4" opacity="{{ blush }}" filter="url(#nbEdge)"/>
      <ellipse cx="200" cy="132" rx="13" ry="6.5" fill="#ffd9b4" opacity="{{ blush }}" filter="url(#nbEdge)"/>
    </svg>
  </div>

  <div style="position: relative; display: flex; align-items: baseline; justify-content: center; gap: 10px; padding: 0 0 34px;">
    <span style="font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; font-size: 46px; line-height: 1; color: #f6efe6; letter-spacing: -0.02em;">{{ ml }}</span>
    <span style="font-size: 15px; font-weight: 650; color: #c9bff0;">von {{ targetMl }} ml heute</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "fill": {"editor": "range", "default": 62, "min": 0, "max": 115, "step": 1, "unit": "%", "section": "Füllstand"},
  "targetMl": {"editor": "int", "default": 605, "min": 100, "max": 1200, "step": 5, "section": "Füllstand"},
  "$preview": {"width": 560, "height": 640}
}'>
class Component extends DCLogic {
  renderVals() {
    const TOP = 168;
    const BOTTOM = 314;

    const pct = Math.max(0, Math.min(115, this.props.fill ?? 62));
    const ratio = pct / 100;
    const clamped = Math.min(1, ratio);
    const fillTop = BOTTOM - clamped * (BOTTOM - TOP);
    const over = ratio > 1.02;

    const depth = 3 + clamped * 15;
    const half = 13 + clamped * 6;
    const mouth = `M${(160 - half).toFixed(1)} 134 Q160 ${(134 + depth).toFixed(1)} ${(160 + half).toFixed(1)} 134`;

    const happy = clamped >= 0.72;
    const eyes = over
      ? 'M126 106 Q136 118 146 106 M174 106 Q184 118 194 106'
      : happy
        ? 'M126 112 Q136 98 146 112 M174 112 Q184 98 194 112'
        : 'M136 108 L136 108 M184 108 L184 108';


    return {
      fillTop,
      fillTopPx: `${fillTop}px`,
      mouth,
      eyes,
      eyeWidth: happy || over ? 3.6 : 9.5,
      blush: Math.max(0, Math.min(0.6, ((clamped - 0.4) / 0.6) * 0.6)).toFixed(2),
      // Je voller, desto mehr Licht wirft die Figur in den Raum.
      haloOpacity: (0.10 + clamped * 0.32).toFixed(2),
      reflectOpacity: (0.08 + clamped * 0.3).toFixed(2),
      reflectRx: (60 + clamped * 60).toFixed(0),
      ml: Math.round((this.props.targetMl ?? 605) * ratio),
      targetMl: this.props.targetMl ?? 605,
    };
  }
}
</script>
</body>
</html>
