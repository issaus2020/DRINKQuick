<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    a { color: #86b6ef; } a:hover { color: #9ec5f4; }

    @keyframes mn-tilt { 0%,100% { transform: rotate(-0.7deg); } 50% { transform: rotate(0.7deg); } }
    .mn-surface { animation: mn-tilt 7s ease-in-out infinite; }
    @keyframes mn-spec { 0%,100% { transform: translate(0,0); opacity: .85; } 50% { transform: translate(3px,-2px); opacity: 1; } }
    .mn-spec { animation: mn-spec 9s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .mn-surface, .mn-spec { animation: none; } }
  </style>
</helmet>

<!-- Die App in Dunkel: dieselben Tokens wie in styles.css, hier ausgeschrieben,
     weil ein Artboard die Variablen der App nicht kennt. -->
<div style="position: relative; width: 100%; height: 100%; background: #121211; overflow: hidden; display: flex; flex-direction: column;">

  <div style="position: absolute; left: -70px; top: -50px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(closest-side, rgba(47,111,158,.42), transparent 70%); filter: blur(14px);"></div>
  <div style="position: absolute; right: -90px; top: 300px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(closest-side, rgba(138,95,63,.30), transparent 70%); filter: blur(18px);"></div>
  <div style="position: absolute; left: 40px; bottom: -140px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(closest-side, rgba(87,74,140,.34), transparent 70%); filter: blur(16px);"></div>

  <div style="position: relative; padding: 10px 16px 8px; background: rgba(18,18,17,.62); border-bottom: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(14px); display: flex; align-items: center; gap: 12px; min-height: 44px; box-sizing: border-box;">
    <span style="flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #16233a;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#3987e5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM9.5 11h.01M14.5 11h.01M9.5 15c.7.8 1.6 1.2 2.5 1.2s1.8-.4 2.5-1.2M12 6V3.5"/>
      </svg>
    </span>
    <span style="min-width: 0;">
      <span style="display: block; font-size: 17px; font-weight: 650; color: #ffffff; line-height: 1.25;">Heute</span>
      <span style="display: block; font-size: 13px; font-weight: 450; color: #c3c2b7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">2 Wochen, 6 Tage · Lebenstag 21</span>
    </span>
  </div>

  <div style="position: relative; flex-grow: 1; min-height: 0; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 16px;">

    <div style="padding: 4px 4px 0;">
      <p style="margin: 0; font-size: 17px; font-weight: 650; color: #c3c2b7; letter-spacing: -0.01em;">Guten Abend, Papa</p>
      <p style="margin: 2px 0 0; font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; font-size: 28px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; color: #ffffff; display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px;">
        Noch <span style="font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; font-size: 52px; letter-spacing: -0.03em; line-height: 1; color: #3987e5;">{{ remaining }}</span><span style="font-size: 20px; font-weight: 650; color: #3987e5;">ml</span>
      </p>
      <p style="margin: 6px 0 0; font-size: 13px; color: #c3c2b7;">{{ ml }} von {{ targetMl }} ml heute</p>
    </div>

    <div style="background: rgba(38,38,40,.62); border: 1px solid rgba(255,255,255,.09); border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.38); backdrop-filter: blur(10px); padding: 16px; display: flex; flex-direction: column; gap: 14px;">

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 0; font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; font-size: 28px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; color: #ffffff;">Noah</h2>
        <figure style="margin: 0; padding-left: 12px; border-left: 2px solid rgba(57,135,229,.45);">
          <blockquote style="margin: 0; font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; font-size: 16px; font-style: italic; line-height: 1.45; color: #c3c2b7; text-wrap: pretty;">Erziehung ist Beispiel und Liebe, sonst nichts.</blockquote>
          <figcaption style="margin-top: 3px; font-size: 12px; color: #94938a;">Johann Heinrich Pestalozzi</figcaption>
        </figure>
      </div>

      <!-- Die Bühne: eine gläserne Kugel braucht einen dunklen Grund und ein
           gerichtetes Licht. Die Glaskarte gibt beides nicht her, deshalb
           liegt hier eine eigene Fläche in der Karte. -->
      <div style="position: relative; border-radius: 16px; overflow: hidden; background: #08090c; border: 1px solid rgba(255,255,255,.07); display: flex; align-items: center; gap: 4px; padding: 8px 14px 8px 4px;">
        <div style="position: absolute; left: 16%; top: 6%; width: 260px; height: 260px; transform: translate(-50%,-50%); background: radial-gradient(closest-side, rgba(150,200,255,.20), transparent 70%);"></div>
        <div style="position: absolute; right: -14%; top: 62%; width: 220px; height: 220px; transform: translate(0,-50%); background: radial-gradient(closest-side, rgba(255,196,140,.16), transparent 70%);"></div>

        <svg viewBox="0 0 320 400" width="158" height="197" style="position: relative; display: block; flex: none;">
          <defs>
            <radialGradient id="mnShell" cx="34%" cy="26%" r="78%">
              <stop offset="0"    stop-color="#3d4d63" stop-opacity=".55"/>
              <stop offset="0.55" stop-color="#141a24" stop-opacity=".85"/>
              <stop offset="1"    stop-color="#0b0e14" stop-opacity=".95"/>
            </radialGradient>
            <radialGradient id="mnHead" cx="32%" cy="24%" r="80%">
              <stop offset="0"    stop-color="#4a5a72"/>
              <stop offset="0.55" stop-color="#1b222e"/>
              <stop offset="1"    stop-color="#0d1118"/>
            </radialGradient>
            <linearGradient id="mnMilk" gradientUnits="userSpaceOnUse" x1="160" y1="319" x2="160" y2="169">
              <stop offset="0"    stop-color="#1d4d8a"/>
              <stop offset="0.45" stop-color="#4e92d8"/>
              <stop offset="0.85" stop-color="#bcdcf7"/>
              <stop offset="1"    stop-color="#eaf4ff"/>
            </linearGradient>
            <radialGradient id="mnCaustic" cx="50%" cy="50%" r="50%">
              <stop offset="0"   stop-color="#9fd0ff" stop-opacity=".55"/>
              <stop offset="0.5" stop-color="#5f9ede" stop-opacity=".18"/>
              <stop offset="1"   stop-color="#5f9ede" stop-opacity="0"/>
            </radialGradient>
            <filter id="mnBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
            <filter id="mnSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
            <filter id="mnFaint" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
            <clipPath id="mnOrb"><circle cx="160" cy="244" r="75"/></clipPath>
            <clipPath id="mnHeadClip"><circle cx="160" cy="104" r="60"/></clipPath>
          </defs>

          <ellipse cx="160" cy="344" rx="126" ry="22" fill="#0d1017"/>
          <ellipse cx="160" cy="342" rx="96" ry="15" fill="#000" opacity=".7" filter="url(#mnBlur)"/>
          <ellipse cx="160" cy="340" rx="{{ causticRx }}" ry="16" fill="url(#mnCaustic)" opacity="{{ causticOpacity }}" filter="url(#mnBlur)"/>

          <ellipse cx="128" cy="330" rx="21" ry="10" fill="#161c26"/>
          <ellipse cx="192" cy="330" rx="21" ry="10" fill="#161c26"/>
          <path d="M96 214 C 72 224, 64 254, 74 276" fill="none" stroke="#1a212c" stroke-width="15" stroke-linecap="round"/>
          <path d="M224 214 C 248 224, 256 254, 246 276" fill="none" stroke="#1a212c" stroke-width="15" stroke-linecap="round"/>
          <circle cx="94" cy="112" r="15" fill="#1a212c"/>
          <circle cx="226" cy="112" r="15" fill="#1a212c"/>

          <!-- Der leere Teil der Kugel: dunkles Glas, hinter der Milch. -->
          <circle cx="160" cy="244" r="75" fill="url(#mnShell)"/>
          <g clip-path="url(#mnOrb)">
            <rect x="80" y="{{ fillTop }}" width="160" height="160" fill="url(#mnMilk)"/>
            <ellipse cx="160" cy="{{ fillTop }}" rx="{{ surfaceRx }}" ry="{{ surfaceRy }}" fill="url(#mnMilk)"/>
            <g class="mn-surface" style="transform-origin: 160px {{ fillTopPx }};">
              <ellipse cx="160" cy="{{ fillTop }}" rx="{{ surfaceRx }}" ry="{{ surfaceRy }}" fill="#e8f3ff" opacity="{{ surfaceOpacity }}"/>
              <ellipse cx="160" cy="{{ fillTop }}" rx="{{ surfaceRx }}" ry="{{ surfaceRy }}" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="{{ meniscusOpacity }}"/>
              <ellipse cx="{{ sheenCx }}" cy="{{ fillTop }}" rx="{{ sheenRx }}" ry="{{ sheenRy }}" fill="#ffffff" opacity="{{ sheenOpacity }}" filter="url(#mnSoft)"/>
            </g>
            <rect x="80" y="{{ fillTop }}" width="160" height="18" fill="#dcecff" opacity="{{ refractOpacity }}" filter="url(#mnSoft)"/>
          </g>

          <!-- Glasschleier über der Milch: echtes Glas dämpft, es deckt nicht zu. -->
          <circle cx="160" cy="244" r="75" fill="#0e141d" opacity=".14"/>
          <g clip-path="url(#mnOrb)" fill="none" stroke-linecap="round">
            <circle cx="160" cy="244" r="74" stroke="#7f95b4" stroke-width="1.6" opacity=".5"/>
            <path d="M228 282 C 246 254, 242 214, 216 190" stroke="#ffd3a8" stroke-width="3.4" opacity=".7" filter="url(#mnFaint)"/>
            <path d="M104 196 C 88 214, 84 238, 88 262" stroke="#dceaff" stroke-width="3" opacity=".55" filter="url(#mnFaint)"/>
          </g>
          <g class="mn-spec">
            <ellipse cx="126" cy="206" rx="17" ry="10" fill="#ffffff" opacity=".5" transform="rotate(-32 126 206)" filter="url(#mnSoft)"/>
            <ellipse cx="122" cy="202" rx="6" ry="3.4" fill="#ffffff" opacity=".85" transform="rotate(-32 122 202)"/>
          </g>

          <circle cx="160" cy="104" r="60" fill="url(#mnHead)"/>
          <g clip-path="url(#mnHeadClip)">
            <ellipse cx="160" cy="176" rx="70" ry="26" fill="#8ec2f0" opacity="{{ bounceOpacity }}" filter="url(#mnBlur)"/>
            <circle cx="160" cy="104" r="59" fill="none" stroke="#8296b2" stroke-width="1.4" opacity=".45"/>
            <path d="M110 66 C 122 50, 140 42, 158 40" fill="none" stroke="#e6f0ff" stroke-width="3" stroke-linecap="round" opacity=".55" filter="url(#mnFaint)"/>
            <path d="M214 138 C 224 118, 222 92, 206 74" fill="none" stroke="#ffd3a8" stroke-width="2.8" stroke-linecap="round" opacity=".5" filter="url(#mnFaint)"/>
          </g>
          <path d="M148 46 Q160 32 173 45" fill="none" stroke="#2b3442" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="160" cy="170" rx="52" ry="12" fill="#05070a" opacity=".65" filter="url(#mnBlur)"/>

          <g stroke="#f4f9ff" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#mnFaint)">
            <path d="{{ eyes }}" stroke-width="{{ eyeWidth }}"/>
            <path d="{{ mouth }}" stroke-width="3.2"/>
          </g>
        </svg>

        <div style="position: relative; display: flex; flex-direction: column; gap: 13px; min-width: 0; flex-grow: 1;">
          <div>
            <div style="font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; font-size: 26px; letter-spacing: -0.03em; line-height: 1.1; color: #ffffff;">vor 36 Min</div>
            <div style="margin-top: 1px; font-size: 12px; line-height: 1.35; color: #c3c2b7;">14:28 · Flasche · 80 ml</div>
          </div>
          <div>
            <div style="font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; font-size: 26px; letter-spacing: -0.03em; line-height: 1.1; color: #ffffff;">5</div>
            <div style="margin-top: 1px; font-size: 12px; line-height: 1.35; color: #c3c2b7;">Mahlzeiten, 2 davon nachts</div>
          </div>
          <div>
            <div style="font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; font-size: 26px; letter-spacing: -0.03em; line-height: 1.1; color: #ffffff;">2 Std 51 Min</div>
            <div style="margin-top: 1px; font-size: 12px; line-height: 1.35; color: #c3c2b7;">Ø Abstand</div>
          </div>
        </div>
      </div>
    </div>

    <div style="background: rgba(38,38,40,.62); border: 1px solid rgba(255,255,255,.09); border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.38); backdrop-filter: blur(10px); padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="min-width: 0; flex-grow: 1;">
          <div style="display: flex; align-items: baseline; gap: 4px;">
            <span style="font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif; font-size: 34px; line-height: 1; color: #3987e5;">75</span>
            <span style="font-size: 15px; font-weight: 650; color: #3987e5;">ml</span>
          </div>
          <div style="margin-top: 4px; font-size: 13px; color: #c3c2b7;">Flasche · üblich um diese Uhrzeit</div>
        </div>
        <span style="flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.09); background: rgba(38,38,40,.62);">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#c3c2b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17zM14.5 6.5l3 3"/></svg>
        </span>
        <span style="flex: none; padding: 13px 22px; border-radius: 999px; background: #3987e5; color: #ffffff; font-size: 16px; font-weight: 650;">Eintragen</span>
      </div>
      <div style="position: relative; height: 22px; display: flex; align-items: center;">
        <div style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 999px; background: #33332f;"></div>
        <div style="position: absolute; left: 0; width: 52%; height: 6px; border-radius: 999px; background: #3987e5;"></div>
        <div style="position: absolute; left: 52%; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: #3987e5; border: 2px solid #232322; box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);"></div>
      </div>
    </div>
  </div>

  <div style="position: relative; flex: none; margin: 0 12px 12px; padding: 6px; border-radius: 999px; background: rgba(44,44,46,.90); border: 1px solid rgba(255,255,255,.09); box-shadow: 0 12px 34px rgba(0,0,0,.45); backdrop-filter: blur(10px); display: flex;">
    <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="5">
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 999px; background: {{ tab.bg }};">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="{{ tab.color }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ tab.icon }}"/></svg>
        <span style="font-size: 11px; font-weight: 650; color: {{ tab.color }};">{{ tab.label }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "fill": {"editor": "range", "default": 63, "min": 0, "max": 115, "step": 1, "unit": "%", "section": "Füllstand"},
  "targetMl": {"editor": "int", "default": 605, "min": 100, "max": 1200, "step": 5, "section": "Füllstand"},
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    const CX = 160;
    const CY = 244;
    const R = 75;
    const TOP = CY - R;
    const BOTTOM = CY + R;

    const pct = Math.max(0, Math.min(115, this.props.fill ?? 63));
    const ratio = pct / 100;
    const clamped = Math.min(1, ratio);
    const fillTop = BOTTOM - clamped * (BOTTOM - TOP);
    const over = ratio > 1.02;
    const target = this.props.targetMl ?? 605;
    const ml = Math.round(target * ratio);

    const dy = fillTop - CY;
    const cut = Math.sqrt(Math.max(0, R * R - dy * dy));
    const surfaceRy = cut * 0.2;
    const empty = clamped < 0.005;

    const depth = 3 + clamped * 15;
    const half = 13 + clamped * 6;
    const happy = clamped >= 0.72;

    const tabs = [
      { label: 'Heute', icon: 'M3 10.5 12 3l9 7.5M5.5 9.5V20h13V9.5M9.5 20v-5.5h5V20', active: true },
      { label: 'Trinken', icon: 'M9 2h6M9.5 5h5M8 8.5h8v11a2.5 2.5 0 0 1-2.5 2.5h-3A2.5 2.5 0 0 1 8 19.5zM8 5.5h8M11 12v4' },
      { label: 'Gewicht', icon: 'M4 7h16l1.5 13.5H2.5zM8.5 11.5a3.5 3.5 0 0 0 7 0M12 7V4M9 4h6' },
      { label: 'Gesundheit', icon: 'M12 20.5s-7.5-4.6-7.5-9.7A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7.5 2.8c0 5.1-7.5 9.7-7.5 9.7Z' },
      { label: 'Mehr', icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12 3.6v1.2M12 19.2v1.2M4.6 12H3.4M20.6 12h-1.2M6.8 6.8 6 6M18 18l-.8-.8M6.8 17.2 6 18M18 6l-.8.8' },
    ].map((tab) => ({
      ...tab,
      color: tab.active ? '#3987e5' : '#94938a',
      bg: tab.active ? '#16233a' : 'transparent',
    }));

    return {
      fillTop,
      fillTopPx: `${fillTop}px`,
      surfaceRx: cut.toFixed(1),
      surfaceRy: surfaceRy.toFixed(1),
      surfaceOpacity: empty ? 0 : 0.28,
      meniscusOpacity: empty ? 0 : 0.5,
      sheenCx: (CX - cut * 0.32).toFixed(1),
      sheenRx: (cut * 0.42).toFixed(1),
      sheenRy: (surfaceRy * 0.5).toFixed(1),
      sheenOpacity: empty ? 0 : 0.5,
      refractOpacity: empty ? 0 : 0.16,
      causticRx: (46 + clamped * 54).toFixed(0),
      causticOpacity: (0.12 + clamped * 0.68).toFixed(2),
      bounceOpacity: (clamped * 0.3).toFixed(2),
      mouth: `M${(CX - half).toFixed(1)} 130 Q${CX} ${(130 + depth).toFixed(1)} ${(CX + half).toFixed(1)} 130`,
      eyes: over
        ? 'M126 102 Q136 114 146 102 M174 102 Q184 114 194 102'
        : happy
          ? 'M126 108 Q136 94 146 108 M174 108 Q184 94 194 108'
          : 'M136 104 L136 104 M184 104 L184 104',
      eyeWidth: happy || over ? 3.4 : 9,
      ml,
      targetMl: target,
      remaining: Math.max(0, target - ml),
      tabs,
    };
  }
}
</script>
</body>
</html>
