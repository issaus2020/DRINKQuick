<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    a { color: #86b6ef; } a:hover { color: #9ec5f4; }
  </style>
</helmet>

<div style="width: 100%; height: 100%; background: #08080a; display: flex; flex-direction: column; box-sizing: border-box; padding: 20px 24px 18px;">

  <div style="display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px;">
    <span style="font-size: 15px; font-weight: 650; color: #ecf9ff;">Der Tag von leer bis über dem Ziel</span>
    <span style="font-size: 13px; line-height: 1.4; color: #86b6ef;">Der Mund wandert stufenlos mit, die Augen in drei Stufen. Nach unten geht er nie – ein leerer Magen am Morgen ist kein Vorwurf. Über dem Ziel steigt die Füllung nicht weiter, sie färbt sich um.</span>
  </div>

  <svg viewBox="0 0 1700 340" width="100%" style="display: block; flex-grow: 1; min-height: 0;" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="stGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="stSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter>
      <linearGradient id="stMilk" gradientUnits="userSpaceOnUse" x1="160" y1="314" x2="160" y2="168">
        <stop offset="0" stop-color="#0f2f5c"/>
        <stop offset="0.5" stop-color="#2a78d6"/>
        <stop offset="1" stop-color="#a8ecff"/>
      </linearGradient>
      <linearGradient id="stOver" gradientUnits="userSpaceOnUse" x1="160" y1="314" x2="160" y2="168">
        <stop offset="0" stop-color="#0b3b23"/>
        <stop offset="0.5" stop-color="#0ca30c"/>
        <stop offset="1" stop-color="#b8f5c8"/>
      </linearGradient>
      <clipPath id="stBelly">
        <path d="M160 168 C 108 168, 82 200, 82 242 C 82 288, 116 314, 160 314 C 204 314, 238 288, 238 242 C 238 200, 212 168, 160 168 Z"/>
      </clipPath>
    </defs>

    <sc-for list="{{ steps }}" as="step" hint-placeholder-count="5">
      <g transform="translate({{ step.x }} 0)">

        <path d="M160 168 C 108 168, 82 200, 82 242 C 82 288, 116 314, 160 314 C 204 314, 238 288, 238 242 C 238 200, 212 168, 160 168 Z"
              fill="rgba(120,190,255,.05)" stroke="rgba(150,205,255,.30)" stroke-width="1.6"/>

        <g clip-path="url(#stBelly)">
          <rect x="70" y="{{ step.fillTop }}" width="180" height="150" fill="{{ step.paint }}" opacity=".92"/>
          <rect x="70" y="{{ step.fillTop }}" width="180" height="2" fill="#dff5ff" opacity="{{ step.meniscus }}" filter="url(#stSoft)"/>
        </g>

        <path d="M160 168 C 108 168, 82 200, 82 242 C 82 288, 116 314, 160 314 C 204 314, 238 288, 238 242 C 238 200, 212 168, 160 168 Z"
              fill="none" stroke="#9fd6ff" stroke-width="1.8" opacity=".85"/>
        <path d="M118 178 C 96 190, 84 214, 83 238" fill="none" stroke="#eaf8ff" stroke-width="2.2" stroke-linecap="round" opacity=".45" filter="url(#stSoft)"/>

        <ellipse cx="132" cy="322" rx="20" ry="10" fill="rgba(120,190,255,.06)" stroke="#7fc6f5" stroke-width="1.5"/>
        <ellipse cx="188" cy="322" rx="20" ry="10" fill="rgba(120,190,255,.06)" stroke="#7fc6f5" stroke-width="1.5"/>
        <path d="M92 206 C 70 214, 62 240, 70 262" fill="none" stroke="#7fc6f5" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M228 206 C 250 214, 258 240, 250 262" fill="none" stroke="#7fc6f5" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="92" cy="116" r="14" fill="rgba(120,190,255,.05)" stroke="#7fc6f5" stroke-width="1.8"/>
        <circle cx="228" cy="116" r="14" fill="rgba(120,190,255,.05)" stroke="#7fc6f5" stroke-width="1.8"/>
        <circle cx="160" cy="108" r="62" fill="rgba(120,190,255,.05)" stroke="#9fd6ff" stroke-width="2" filter="url(#stGlow)"/>
        <path d="M112 72 C 122 58, 140 48, 158 46" fill="none" stroke="#f2fbff" stroke-width="2.6" stroke-linecap="round" opacity=".5" filter="url(#stSoft)"/>
        <path d="M148 50 Q160 36 173 49" fill="none" stroke="#7fc6f5" stroke-width="2.2" stroke-linecap="round"/>

        <g filter="url(#stGlow)" stroke="#ecf9ff" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="{{ step.eyes }}" stroke-width="{{ step.eyeWidth }}"/>
          <path d="{{ step.mouth }}" stroke-width="3"/>
        </g>

      </g>
    </sc-for>
  </svg>

  <!-- Beschriftung als HTML: Platzhalter in einem SVG-Textknoten bleiben leer. -->
  <div style="display: flex; gap: 0; margin-top: 4px;">
    <sc-for list="{{ steps }}" as="step" hint-placeholder-count="5">
      <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <span style="font-size: 17px; font-weight: 650; color: {{ step.labelColor }};">{{ step.ml }} ml</span>
        <span style="font-size: 13px; color: #7ba7d4;">{{ step.mood }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const TOP = 168;
    const BOTTOM = 314;
    const TARGET = 605;

    const steps = [0, 0.25, 0.55, 0.85, 1.1].map((ratio, index) => {
      const clamped = Math.min(1, ratio);
      const over = ratio > 1.02;
      const fillTop = BOTTOM - clamped * (BOTTOM - TOP);

      const depth = 3 + clamped * 15;
      const half = 13 + clamped * 6;
      const happy = clamped >= 0.72;

      return {
        x: index * 344,
        fillTop,
        paint: over ? 'url(#stOver)' : 'url(#stMilk)',
        meniscus: ratio > 0.02 ? 0.9 : 0,
        mouth: `M${(160 - half).toFixed(1)} 134 Q160 ${(134 + depth).toFixed(1)} ${(160 + half).toFixed(1)} 134`,
        eyes: over
          ? 'M126 106 Q136 118 146 106 M174 106 Q184 118 194 106'
          : happy
            ? 'M126 112 Q136 98 146 112 M174 112 Q184 98 194 112'
            : 'M136 108 L136 108 M184 108 L184 108',
        eyeWidth: happy || over ? 3.4 : 9,
        ml: Math.round(TARGET * ratio),
        labelColor: over ? '#7ce89a' : '#dff1ff',
        mood: over ? 'satt, Ziel überschritten' : happy ? 'fröhlich' : clamped >= 0.4 ? 'zufrieden' : clamped > 0 ? 'ruhig' : 'ruhig, Tag beginnt',
      };
    });

    return { steps };
  }
}
</script>
</body>
</html>
