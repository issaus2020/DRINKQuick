<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #2a78d6; }
    a:hover { color: #1c5cab; }

    .root {
      position: relative;
      width: 390px;
      height: 560px;
      overflow: hidden;
      background: #faf8f5;
      color: #0b0b0b;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 22px 24px;
      box-sizing: border-box;
    }

    /* Derselbe Grund wie in der App: warmes Papier, weiche Lichtwolken. */
    .bloom { position: absolute; border-radius: 50%; filter: blur(52px); pointer-events: none; }
    .bloom--1 {
      width: 300px; height: 260px; top: -80px; left: -70px;
      background: radial-gradient(circle, #8ec7ef, transparent 68%);
      opacity: 0.55;
    }
    .bloom--2 {
      width: 280px; height: 250px; bottom: -70px; right: -80px;
      background: radial-gradient(circle, #f2c9a8, transparent 68%);
      opacity: 0.5;
    }

    .stack { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 4px; }

    .cap {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #7c7a73;
    }

    .value {
      font-family: ui-serif, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
      font-size: 2.75rem;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .value__unit { font-size: 1.125rem; color: #52514e; }

    .mood {
      font-family: ui-serif, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
      font-size: 1.375rem;
      line-height: 1.2;
    }

    .ink {
      fill: none;
      stroke: #3b3a35;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Kein Hautton: die Figur ist eine Linienzeichnung auf Papier, gefüllt ist
       nur der Bauch. Was man sieht, ist also ausschließlich die Trinkmenge. */
    .paper { fill: #ffffff; }
    .face {
      fill: none;
      stroke: #3b3a35;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .blush { fill: #e8836a; }
    .wave { animation: flow 9s linear infinite; }
    .wave--back { animation: flow 14s linear infinite reverse; opacity: 0.55; }
    @keyframes flow { to { transform: translateX(-50px); } }
    @media (prefers-reduced-motion: reduce) {
      .wave { animation: none; }
    }
  </style>
</helmet>

<div class="root">
  <div class="bloom bloom--1"></div>
  <div class="bloom bloom--2"></div>

  <div class="stack">
    <span class="cap">Heute getrunken</span>
    <span class="value">
      {{ml}}<span class="value__unit"> von 605 ml</span>
    </span>

    <svg class="baby" viewBox="0 0 140 190" style="width: 232px; height: 315px" role="img" aria-label="{{alt}}">
      <defs>
        <clipPath id="bellyMain">
          <path d="M70 80 C 40 80, 26 100, 26 124 C 26 150, 44 166, 70 166 C 96 166, 114 150, 114 124 C 114 100, 100 80, 70 80 Z"></path>
        </clipPath>
      </defs>

      <g style="transform: rotate({{tilt}}deg); transform-origin: 70px 110px">
        <ellipse class="ink paper" cx="54" cy="169" rx="12" ry="8"></ellipse>
        <ellipse class="ink paper" cx="86" cy="169" rx="12" ry="8"></ellipse>

        <path class="ink paper" d="M70 80 C 40 80, 26 100, 26 124 C 26 150, 44 166, 70 166 C 96 166, 114 150, 114 124 C 114 100, 100 80, 70 80 Z"></path>

        <g clip-path="url(#bellyMain)">
          <rect x="20" y="{{fillTop}}" width="100" height="120" fill="{{liquid}}"></rect>
          <g style="transform: translate(-10px, {{fillTop}}px)">
            <g class="wave">
              <path d="M0 0 Q 12.5 -6, 25 0 T 50 0 T 75 0 T 100 0 T 125 0 T 150 0 T 175 0 T 200 0 L200 60 L0 60 Z" fill="{{liquid}}"></path>
            </g>
            <g class="wave wave--back">
              <path d="M0 2 Q 12.5 -4, 25 2 T 50 2 T 75 2 T 100 2 T 125 2 T 150 2 T 175 2 T 200 2 L200 60 L0 60 Z" fill="{{liquidSoft}}"></path>
            </g>
          </g>
        </g>

        <circle class="ink paper" cx="30" cy="52" r="8"></circle>
        <circle class="ink paper" cx="110" cy="52" r="8"></circle>
        <circle class="ink paper" cx="70" cy="48" r="38"></circle>
        <path class="ink" d="M62 12 Q70 2 79 11"></path>

        <ellipse class="blush" cx="42" cy="60" rx="7" ry="4.5" style="opacity: {{blush}}"></ellipse>
        <ellipse class="blush" cx="98" cy="60" rx="7" ry="4.5" style="opacity: {{blush}}"></ellipse>

        <path class="face" d="{{eyes}}" style="stroke-width: {{eyeW}}px"></path>
        <path class="face" d="{{mouth}}"></path>

        <path class="ink" d="M34 100 C 20 106, 15 119, 21 129"></path>
        <path class="ink" d="M106 100 C 120 106, 125 119, 119 129"></path>
      </g>
    </svg>

    <span class="mood">{{mood}}</span>
    <span class="cap">Zieh am Regler „Füllstand“, um die Züge zu prüfen</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"fill":{"editor":"range","default":63,"min":0,"max":115,"step":1,"unit":"%","section":"Füllstand"},"$preview":{"width":390,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const t = Math.max(0, Math.min(1.15, (this.props.fill ?? 63) / 100));
    const clamped = Math.min(1, t);
    const over = t > 1.02;

    // Der Bauch reicht von y=80 bis y=166; die Wasserlinie sitzt exakt auf
    // dem Anteil, nicht ungefähr.
    const fillTop = 166 - clamped * 86;

    // Der Mund trägt die Hauptaussage und wandert stufenlos mit: von einer
    // kaum gebogenen, ruhigen Linie zu einem breiten Lachen. Nach unten geht
    // er nie - ein trauriges Baby um neun Uhr morgens wäre ein Vorwurf.
    const md = 2 + clamped * 11;
    const mw = 9 + clamped * 4;

    let eyes;
    let eyeW;
    let mood;
    if (over) {
      eyes = 'M50 46 Q56 53 62 46 M78 46 Q84 53 90 46';
      eyeW = 4;
      mood = 'Satt und zufrieden';
    } else if (clamped >= 0.72) {
      eyes = 'M50 50 Q56 41 62 50 M78 50 Q84 41 90 50';
      eyeW = 4;
      mood = 'Fröhlich';
    } else if (clamped >= 0.4) {
      eyes = 'M56 47 L56 47 M84 47 L84 47';
      eyeW = 8;
      mood = 'Zufrieden';
    } else {
      eyes = 'M56 47 L56 47 M84 47 L84 47';
      eyeW = 8;
      mood = 'Ruhig, der Tag ist jung';
    }

    return {
      fillTop: Number(fillTop.toFixed(1)),
      mouth: `M${(70 - mw).toFixed(1)} 64 Q70 ${(64 + md).toFixed(1)} ${(70 + mw).toFixed(1)} 64`,
      eyes,
      eyeW,
      mood,
      blush: Math.max(0, Math.min(0.5, ((clamped - 0.45) / 0.55) * 0.5)).toFixed(2),
      tilt: (clamped * 3).toFixed(1),
      liquid: over ? '#72c972' : '#72a6e4',
      liquidSoft: over ? '#a8dda8' : '#a3c6ee',
      ml: Math.round((605 * t) / 5) * 5,
      alt: `Baby, Magen zu ${Math.round(t * 100)} Prozent gefüllt.`,
    };
  }
}
</script>
</body>
</html>
