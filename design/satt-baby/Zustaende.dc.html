<helmet>
  <style>
    body { margin: 0; }
    a { color: #2a78d6; }
    a:hover { color: #1c5cab; }

    .root {
      position: relative;
      width: 820px;
      height: 400px;
      overflow: hidden;
      background: #faf8f5;
      color: #0b0b0b;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 22px 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bloom { position: absolute; border-radius: 50%; filter: blur(56px); pointer-events: none; }
    .bloom--1 {
      width: 340px; height: 260px; top: -90px; left: 90px;
      background: radial-gradient(circle, #8ec7ef, transparent 68%);
      opacity: 0.45;
    }
    .bloom--2 {
      width: 320px; height: 250px; bottom: -90px; right: 60px;
      background: radial-gradient(circle, #f2c9a8, transparent 68%);
      opacity: 0.4;
    }

    .head { position: relative; z-index: 2; display: flex; align-items: baseline; gap: 10px; }
    .head__title {
      font-family: ui-serif, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
      font-size: 1.375rem;
    }
    .head__spacer { flex-grow: 1; }
    .cap { font-size: 11px; letter-spacing: 0.06em; color: #7c7a73; }

    .row {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px;
    }

    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .cell__pct {
      margin-top: 6px;
      font-family: ui-serif, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
      font-size: 1.25rem;
      line-height: 1;
    }
    .cell__ml { font-size: 11px; color: #7c7a73; }
    .cell__mood { font-size: 12px; color: #52514e; }

    .ink {
      fill: none;
      stroke: #3b3a35;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Kein Hautton: die Figur ist eine Linienzeichnung auf Papier, gefüllt ist
       nur der Bauch. Was man sieht, ist also ausschließlich die Trinkmenge. */
    .paper { fill: #ffffff; }
    .face {
      fill: none;
      stroke: #3b3a35;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .blush { fill: #e8836a; }
    .wave { animation: flow 9s linear infinite; }
    .wave--back { animation: flow 14s linear infinite reverse; opacity: 0.55; }
    @keyframes flow { to { transform: translateX(-50px); } }
    @media (prefers-reduced-motion: reduce) {
      .wave { animation: none; }
    }

  </style>
</helmet>
